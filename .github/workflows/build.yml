name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KS_PASS || 'frgame2900pass' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Create signing key (first run only)
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -alias frgame -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=fr_game2900"
            git config user.name github-actions
            git config user.email actions@github.com
            git add release.keystore
            git commit -m "Add signing key"
            git push
          fi
      - name: Setup Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www && cp index.html www/index.html
          npx cap init "Dungeon" com.frgame.dungeon --web-dir=www
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&<item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Build and sign release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks ../release.keystore --ks-pass pass:$KS_PASS --key-pass pass:$KS_PASS --ks-key-alias frgame --out app-release.apk aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-apk
          path: android/app-release.apk
